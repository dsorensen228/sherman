<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Project Sherman broad goal sheet</title>
  <desc id="desc">A visual summary of the mission, design pillars, phased plan, target envelope, and success conditions for a tiny autonomous desktop robot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ea"/><stop offset="1" stop-color="#e7eef0"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#202a2d"/><stop offset="1" stop-color="#0d1214"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#213238" flood-opacity=".18"/></filter>
    <style>
      .kicker{font:700 18px ui-sans-serif,system-ui;letter-spacing:3px;fill:#40727a}.h1{font:800 56px ui-sans-serif,system-ui;fill:#17272b}.sub{font:400 22px ui-sans-serif,system-ui;fill:#44595e}.h2{font:750 24px ui-sans-serif,system-ui;fill:#17272b}.body{font:400 19px ui-sans-serif,system-ui;fill:#41565b}.small{font:500 16px ui-sans-serif,system-ui;fill:#50666b}.metric{font:750 25px ui-monospace,SFMono-Regular,monospace;fill:#1c515a}.phase{font:700 17px ui-sans-serif,system-ui;fill:#f8fbfb}.phaseText{font:500 15px ui-sans-serif,system-ui;fill:#365157}.card{fill:#ffffff;stroke:#d7e0df;stroke-width:2}.line{stroke:#8eb1b5;stroke-width:4;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1490" cy="-20" r="280" fill="#b8d9d7" opacity=".45"/><circle cx="-40" cy="850" r="250" fill="#f0cb91" opacity=".38"/>
  <text x="78" y="76" class="kicker">PROJECT SHERMAN · V0.1 INTENT</text>
  <text x="76" y="148" class="h1">A tiny coworker with a world model.</text>
  <text x="78" y="198" class="sub">Maps the desk · notices change · investigates · communicates through eyes and motion</text>

  <g transform="translate(84 265)" filter="url(#shadow)">
    <ellipse cx="240" cy="340" rx="220" ry="35" fill="#24383c" opacity=".16"/>
    <path d="M42 160 Q55 65 164 42 H316 Q415 58 432 158 L424 290 Q406 337 344 348 H130 Q62 338 46 287Z" fill="#f4efe5" stroke="#d7d0c3" stroke-width="4"/>
    <path d="M48 244 H427 L424 291 Q407 337 344 348 H130 Q62 338 46 287Z" fill="#293538"/>
    <rect x="76" y="105" width="325" height="155" rx="58" fill="url(#face)" stroke="#536569" stroke-width="4"/>
    <g fill="none" stroke="#baf7f4" stroke-width="16"><ellipse cx="178" cy="179" rx="38" ry="45"/><ellipse cx="302" cy="179" rx="38" ry="45"/></g>
    <circle cx="240" cy="238" r="10" fill="#12191b" stroke="#6f8185" stroke-width="3"/><rect x="211" y="246" width="18" height="6" rx="3" fill="#42585d"/><rect x="252" y="246" width="18" height="6" rx="3" fill="#42585d"/>
    <circle cx="420" cy="282" r="58" fill="#151c1e" stroke="#46585c" stroke-width="8"/><circle cx="420" cy="282" r="42" fill="#2b373a"/>
    <path d="M100 95 Q238 48 378 94" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5"/>
  </g>

  <g transform="translate(590 258)">
    <rect class="card" width="430" height="215" rx="24"/>
    <text x="28" y="42" class="h2">Design pillars</text>
    <text x="30" y="82" class="body">● Alive — purposeful routines</text>
    <text x="30" y="116" class="body">● Legible — eyes reveal intent</text>
    <text x="30" y="150" class="body">● Trustworthy — local safety</text>
    <text x="30" y="184" class="body">● Persistent — aged beliefs</text>
  </g>
  <g transform="translate(1044 258)">
    <rect class="card" width="468" height="215" rx="24"/>
    <text x="28" y="42" class="h2">First physical target</text>
    <text x="28" y="86" class="metric">≤ 75 × 65 × 50 mm</text>
    <text x="28" y="125" class="body">Stretch: 70 × 60 × 45 mm · mass ≤ 180 g</text>
    <text x="28" y="159" class="body">≥ 120 min mixed patrol runtime</text>
    <text x="28" y="193" class="small">Target only—CAD, power, thermal and safety gates decide.</text>
  </g>

  <g transform="translate(590 500)">
    <text x="0" y="0" class="h2">Six evidence-gated phases</text>
    <line x1="50" y1="70" x2="840" y2="70" class="line"/>
    <g transform="translate(18 38)"><circle cx="32" cy="32" r="32" fill="#397782"/><text x="32" y="38" text-anchor="middle" class="phase">0</text><text x="0" y="92" class="phaseText">Personality</text><text x="-8" y="114" class="small">simulator</text></g>
    <g transform="translate(174 38)"><circle cx="32" cy="32" r="32" fill="#397782"/><text x="32" y="38" text-anchor="middle" class="phase">1</text><text x="5" y="92" class="phaseText">Brain</text><text x="-4" y="114" class="small">eyes + link</text></g>
    <g transform="translate(330 38)"><circle cx="32" cy="32" r="32" fill="#397782"/><text x="32" y="38" text-anchor="middle" class="phase">2</text><text x="5" y="92" class="phaseText">Vision</text><text x="-12" y="114" class="small">stationary map</text></g>
    <g transform="translate(486 38)"><circle cx="32" cy="32" r="32" fill="#397782"/><text x="32" y="38" text-anchor="middle" class="phase">3</text><text x="-1" y="92" class="phaseText">Mobility</text><text x="-10" y="114" class="small">safe chassis</text></g>
    <g transform="translate(642 38)"><circle cx="32" cy="32" r="32" fill="#397782"/><text x="32" y="38" text-anchor="middle" class="phase">4</text><text x="-13" y="92" class="phaseText">World model</text><text x="-5" y="114" class="small">curiosity</text></g>
    <g transform="translate(798 38)"><circle cx="32" cy="32" r="32" fill="#397782"/><text x="32" y="38" text-anchor="middle" class="phase">5</text><text x="-2" y="92" class="phaseText">Character</text><text x="-8" y="114" class="small">daily life</text></g>
  </g>

  <g transform="translate(85 700)">
    <rect width="1427" height="126" rx="25" fill="#193136"/>
    <text x="34" y="42" class="kicker" fill="#89d4d1">SUCCESS LOOKS LIKE</text>
    <text x="34" y="84" style="font:600 19px ui-sans-serif,system-ui;fill:#f4f7f5">Safe offline · useful to Jarvis · emotionally legible · resilient to failure · at home between keyboard and coffee</text>
    <text x="34" y="111" style="font:500 16px ui-sans-serif,system-ui;fill:#a9bdc0">Cute before clever—but never cute before safe.</text>
  </g>
</svg>
