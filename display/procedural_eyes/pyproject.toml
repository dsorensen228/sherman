[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherman-procedural-eyes"
version = "0.1.0"
description = "Purple RGB565 procedural eyes for Sherman"
requires-python = ">=3.11"
dependencies = ["Pillow>=9"]

[tool.setuptools]
packages = ["sherman_procedural_eyes"]
